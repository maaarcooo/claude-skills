interface:
  display_name: anki flashcard generator
  short_description: Generate Anki flashcard decks from PDF or Markdown study materials.
    Use only when "Anki flashcard" or "Anki deck" is explicitly mentioned. Do not
    trigger for generic flashcard requests. Outputs in Anki-importable format (Question
    | Answer).
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
